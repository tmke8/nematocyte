[project]
name = "nematocyte-example"
version = "0.1.0"
description = "Add your description here"
authors = [{ name = "Thomas M Kehrenberg", email = "tmke8@posteo.net" }]
dependencies = [
    # The extras are needed for the SLURM launcher and the Optuna sweeper.
    "nematocyte[optuna,submitit]",
    "torch~=2.14.1",
    "wandb~=0.30.0",
]
readme = "README.md"
requires-python = ">= 3.14"

[tool.uv.sources]
# nematocyte is the package in the parent directory.
nematocyte = { path = "..", editable = true }
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ty.rules]
disjoint-cast = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
truthiness-test-of-none-union = "warn"
unsound-assignment = "warn"
unsound-return-statement = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-args
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "FBT", # boolean trap
    "I",   # isort
    "INP", # implicit namespace package
    "N",   # pep8-naming
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactor
    "PLW", # pylint warning
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",
]
ignore = [
    "E501",    # line too long (conflicts with formatter)
    "N812",    # case of import alias
    "PLR0402", # useless import alias
    "PLR2004", # magic number comparison
    "PLR0913", # too many arguments
    "PLW2901", # overwriting loop variables
    "PLC0105", # mark variance in typevar name
    "W191",    # tab indentation (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F403",
    "PLC0414", # reexporting
]

[tool.ruff.lint.isort]
known-third-party = ["nematocyte"]
extra-standard-library = ["typing_extensions"]
no-lines-before = ["future", "standard-library"]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.pylint]
max-statements = 60 # default: 50
max-branches = 13   # default: 12

[dependency-groups]
dev = [
    "pytest~=9.1",
]
