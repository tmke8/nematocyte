---
_doc_: A CNN on ColoredMNIST, with AdamW.
# Primary configs can be kept in a subdirectory. Select this one with
# `--config-name experiments/cmnist_cnn`.
_defaults_:
  dm: cmnist
  model: cnn
  opt: weight_decay_adamw

dm:
  num_colors: 10
  val_prop: 0.2

model:
  kernel_size: 5

opt:
  lr: 3.e-3
