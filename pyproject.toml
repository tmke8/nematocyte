[project]
name = "nematocyte"
version = "0.1.0"
description = "Configuration for Python programs, as a tree of dataclasses filled from YAML or JSON5 files and the command line"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Thomas M Kehrenberg", email = "tmke8@posteo.net" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "ruamel-yaml>=0.18",
    "typing-extensions>=4.16",
]

[project.optional-dependencies]
submitit = [
    "submitit>=1.5",
]
optuna = [
    "optuna>=4",
]
json5 = [
    "json5>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "reference" },
]
# The tests of the launchers, the sweepers and the JSON5 files need the
# optional extras.
test = ["pytest>=8", "submitit>=1.5", "optuna>=4", "json5>=0.17"]
lint = ["ruff>=0.14", "ty"]
# Not used by nematocyte; installed to compare behaviour during development.
reference = [
    "hydra-core==1.4.0rc3",
    "hydra-qol>=0.2.3",
    "tyro>=1.0.17",
]
typecheck = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A test that drops a value with a selection on purpose says so with
# `pytest.warns`; anywhere else, the warning is a mistake in the test.
filterwarnings = ["error::nematocyte.DroppedValueWarning"]

# pyright does not read the version from `requires-python`. Without this, a
# pyright outside the project uses whatever Python is first on the PATH.
[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
disjoint-cast = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"
truthiness-test-of-none-union = "warn"
unsound-assignment = "warn"
unsound-return = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"
# The example is a project of its own, with its own configuration.
extend-exclude = ["example"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-args
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle
    "F",   # pyflakes
    "FBT", # boolean trap
    "I",   # isort
    "INP", # implicit namespace package
    "N",   # pep8-naming
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactor
    "PLW", # pylint warning
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",
]
ignore = [
    "E501",    # line too long (conflicts with formatter)
    "N812",    # case of import alias
    "PLR0402", # useless import alias
    "PLR2004", # magic number comparison
    "PLR0913", # too many arguments
    "PLW2901", # overwriting loop variables
    "PLC0105", # mark variance in typevar name
    "W191",    # tab indentation (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F403",
    "PLC0414", # reexporting
]
"tests/**" = ["INP"]

[tool.ruff.lint.isort]
extra-standard-library = ["typing_extensions"]
no-lines-before = ["future", "standard-library"]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.pylint]
max-statements = 60 # default: 50
max-branches = 13   # default: 12
